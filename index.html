<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FFF2F5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Página en Mantenimiento 🚧✨ | Se vienen cositas</title>
  
  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="manifest.json" />
  <link rel="shortcut icon" href="Ivonne.ico" type="image/x-icon" />
  <link rel="icon" href="Ivonne.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <!-- Google Fonts: Quicksand & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            quicksand: ['Quicksand', 'sans-serif'],
            nunito: ['Nunito', 'sans-serif'],
          },
          colors: {
            roseCozy: {
              bg: '#FFF2F5',
              card: '#FFFFFF',
              text: '#4A1D34',
              subtext: '#834C68',
              pinkPrimary: '#EC4899',
              pinkLight: '#FCE7F3',
              pinkBorder: '#FBCFE8',
            }
          },
          boxShadow: {
            'pop-pink': '0 20px 35px -5px rgba(236, 72, 153, 0.22)',
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    body {
      font-family: 'Nunito', sans-serif;
      background-color: #FFF2F5;
      color: #4A1D34;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    h1, h2, h3 {
      font-family: 'Quicksand', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-roseCozy-bg flex items-center justify-center p-4 selection:bg-pink-100 selection:text-pink-800">

  <!-- Ambient Background Orbs -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-40">
    <div class="absolute -top-10 -left-10 w-72 h-72 bg-pink-200 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-10 -right-10 w-80 h-80 bg-purple-200 rounded-full blur-3xl"></div>
  </div>

  <!-- MAINTENANCE CARD -->
  <main class="relative z-10 w-full max-w-sm bg-white rounded-3xl p-6 sm:p-8 border-2 border-roseCozy-pinkBorder shadow-pop-pink text-center space-y-5">
    
    <!-- Top Icon Badge -->
    <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-gradient-to-tr from-pink-200 via-purple-100 to-amber-100 border-2 border-pink-300 shadow-md">
      <span class="text-4xl animate-bounce">🚧</span>
    </div>

    <!-- Title & Subtitle -->
    <div class="space-y-2">
      <span class="inline-block px-3 py-1 rounded-full bg-pink-100 text-pink-700 text-xs font-bold uppercase tracking-wider border border-pink-200">
        ✨ Modo Secreto Activo
      </span>
      <h1 class="text-2xl font-bold text-roseCozy-text">
        Página en Mantenimiento
      </h1>
      <p class="text-sm font-bold text-pink-600">
        Se vienen cositas... jaja 💖🎃
      </p>
    </div>

    <!-- Friendly Message -->
    <div class="p-4 rounded-2xl bg-pink-50/70 border border-pink-200 text-xs text-roseCozy-subtext leading-relaxed font-semibold">
      <p class="mb-2">🐾 Kira y Fernando están afinando los detalles de algo muy especial para ti.</p>
      <p class="italic text-pink-700 font-bold">"Recordatorio oficial: ¡prohibido curiosear antes de tiempo! 🚫📦"</p>
    </div>

    <!-- Interactive Button -->
    <button 
      onclick="triggerConfetti()" 
      class="w-full py-3 rounded-2xl bg-gradient-to-r from-pink-500 to-rose-400 text-white font-extrabold text-xs shadow-md hover:shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2"
    >
      <span>✨</span>
      <span>Tocar para ver avance (Secreto)</span>
    </button>

    <!-- Footer Note -->
    <p id="secret-msg" class="text-[11px] text-gray-400 font-semibold italic min-h-[20px]">
      Vuelve muy pronto... 💖
    </p>

  </main>

  <script>
    function triggerConfetti() {
      const msg = document.getElementById('secret-msg');
      msg.innerText = "🐾 Kira dice: ¡Ten paciencia Ivonne, valdrá 100% la pena!";
      msg.classList.add('text-pink-600', 'font-bold');

      if (typeof confetti === 'function') {
        confetti({
          particleCount: 40,
          spread: 60,
          origin: { y: 0.6 },
          colors: ['#EC4899', '#F472B6', '#FBCFE8', '#FB923C']
        });
      }
    }
  </script>
</body>
</html>
